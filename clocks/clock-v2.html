<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Retro Clock</title>
    <style>
        @font-face {
            font-family: "LineBeam";
            src: url('../assets/fonts/LineBeam.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            font-family: monospace;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Star field background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #4169E1;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        .star::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4169E1;
            font-size: 8px;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        .clock-container {
            text-align: center;
            padding: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #clocktext {
            font-family: "LineBeam", monospace;
            font-size: 8vw;
            letter-spacing: 2px;
            color: white;
            text-shadow: 
                0 0 5px rgba(255, 255, 255, 0.5),
                0 0 10px rgba(255, 255, 255, 0.3);
        }

        .separator {
            animation: blink 1s infinite;
            opacity: 0.8;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Generate stars dynamically -->
    <div class="stars" id="starfield"></div>

    <div class="clock-container">
        <div id="clocktext">00:00:00</div>
    </div>

    <script>
        "use strict";

        // Generate starfield
        const starfield = document.getElementById('starfield');
        const numberOfStars = 500;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            starfield.appendChild(star);
        }

        const clockText = document.getElementById("clocktext");

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            clockText.innerHTML = `${hours}<span class="separator">:</span>${minutes}<span class="separator">:</span>${seconds}`;

            setTimeout(updateClock, 1000 - now.getMilliseconds() + 20);
        }

        updateClock();
    </script>
</body>
</html>
